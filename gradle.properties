org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# The Kotlin compiler runs in its own daemon JVM, which does not inherit
# org.gradle.jvmargs. Without this it inherits the platform charset (Windows-1252
# on a default Windows box) and silently corrupts every non-ASCII source literal.
kotlin.daemon.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# The Kotlin daemon has been crashing on this machine and the
# fallback compile then reports every symbol in the project as unresolved.
# Compiling in the Gradle daemon avoids it.
kotlin.compiler.execution.strategy=in-process
