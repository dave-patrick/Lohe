name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then echo "::error::sdkmanager not found under $ANDROID_SDK_ROOT"; exit 1; fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Write local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Verify FOSS cleanliness
        run: |
          set -euo pipefail
          test ! -d app/src/main/java/com/lohe/app/pro
          grep -q 'const val HAS_PRO = false' app/src/main/java/com/lohe/app/edition/Edition.kt
          ! grep -qE 'billing|play\.services|SYSTEM_ALERT_WINDOW|LoheFloatingOverlayService' app/build.gradle.kts app/src/main/AndroidManifest.xml

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Check privacy policy copies
        shell: pwsh
        run: ./tools/prepare-privacy-policy.ps1 -Check

      - name: Android lint
        run: ./gradlew lintRelease --console=plain

      - name: Assemble debug APK and instrumented tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest --console=plain

      - name: Validate unsigned FOSS release APK build
        run: ./gradlew assembleRelease --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Read build metadata
        id: metadata
        run: |
          echo "build_id=$(sed -n 's/^val loheBuildId = "\(.*\)"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "release=$(sed -n 's/^val loheReleaseVersion = "\(.*\)"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned FOSS release APK and R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lohe-${{ steps.metadata.outputs.release }}-build-${{ steps.metadata.outputs.build_id }}-foss-UNSIGNED
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 14

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
