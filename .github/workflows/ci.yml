name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          # Matches the version the build is verified against locally, and the
          # floor AGP 9.4.1 requires.
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # android-actions/setup-android@v3 was tried here and failed: it shells
      # out to `sdkmanager tools`, and that package no longer exists under
      # cmdline-tools 16. The runner image already ships an SDK, so drive
      # sdkmanager directly instead.
      #
      # It is not on PATH by default — hence the explicit lookup. The platform
      # is `android-37.0` (preview-style suffix), which is what compileSdk 37
      # resolves to locally.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then echo "::error::sdkmanager not found under $ANDROID_SDK_ROOT"; exit 1; fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Write local.properties
        # The SDK path is machine-local and gitignored, so CI declares it the
        # same way a developer does. Never committed.
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Unit tests
        run: ./gradlew :app:testFossDebugUnitTest :app:testPlayDebugUnitTest :sync-app:testDebugUnitTest --console=plain

      - name: Check privacy policy copies
        shell: pwsh
        run: ./tools/prepare-privacy-policy.ps1 -Check

      - name: Verify FOSS dependency isolation
        run: ./gradlew :app:verifyFossDependencies --console=plain

      - name: Android lint
        run: ./gradlew :app:lintFossRelease :app:lintPlayRelease :sync-app:lintRelease --console=plain

      - name: Assemble debug APKs and instrumented tests
        run: ./gradlew assembleFossDebug assembleFossDebugAndroidTest assemblePlayDebug assemblePlayDebugAndroidTest --console=plain

      - name: Validate unsigned Play bundle build
        # Signing credentials are deliberately absent from this step so the CI Play
        # artifact stays explicitly unsigned.
        run: ./gradlew bundlePlayRelease --console=plain

      - name: Read build metadata
        id: metadata
        run: |
          echo "build_id=$(sed -n 's/^val loheBuildId = "\(.*\)"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "release=$(sed -n 's/^val loheReleaseVersion = "\(.*\)"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Prepare FOSS signing keystore
        id: signing
        env:
          LOHE_KEYSTORE_BASE64: ${{ secrets.LOHE_KEYSTORE_BASE64 }}
          LOHE_KEYSTORE_PASSWORD: ${{ secrets.LOHE_KEYSTORE_PASSWORD }}
          LOHE_KEY_ALIAS: ${{ secrets.LOHE_KEY_ALIAS }}
          LOHE_KEY_PASSWORD: ${{ secrets.LOHE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$LOHE_KEYSTORE_BASE64" ] && [ -n "$LOHE_KEYSTORE_PASSWORD" ] && [ -n "$LOHE_KEY_ALIAS" ] && [ -n "$LOHE_KEY_PASSWORD" ]; then
            KEYSTORE_FILE="$RUNNER_TEMP/lohe-release.keystore"
            printf '%s' "$LOHE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"
            chmod 600 "$KEYSTORE_FILE"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$KEYSTORE_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "keystore_path=" >> "$GITHUB_OUTPUT"
            echo "::notice::FOSS signing secrets (LOHE_KEYSTORE_BASE64, LOHE_KEYSTORE_PASSWORD, LOHE_KEY_ALIAS, LOHE_KEY_PASSWORD) are not set for this run; building unsigned FOSS APK."
          fi

      - name: Build FOSS release APK and owner sync APK
        env:
          LOHE_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          LOHE_KEYSTORE_PASSWORD: ${{ secrets.LOHE_KEYSTORE_PASSWORD }}
          LOHE_KEY_ALIAS: ${{ secrets.LOHE_KEY_ALIAS }}
          LOHE_KEY_PASSWORD: ${{ secrets.LOHE_KEY_PASSWORD }}
          FOSS_SIGNED: ${{ steps.signing.outputs.signed }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.release }}
          BUILD_ID: ${{ steps.metadata.outputs.build_id }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleFossRelease :sync-app:assembleRelease --console=plain
          mkdir -p foss-output sync-output
          if [ "$FOSS_SIGNED" = "true" ]; then
            SRC_APK="app/build/outputs/apk/foss/release/app-foss-release.apk"
            OUT_NAME="Lohe-${RELEASE_VERSION}-build-${BUILD_ID}-foss-release.apk"
            SYNC_SRC="sync-app/build/outputs/apk/release/sync-app-release.apk"
            SYNC_NAME="LoheSync-${RELEASE_VERSION}-build-${BUILD_ID}-release.apk"
          else
            SRC_APK="app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk"
            OUT_NAME="Lohe-${RELEASE_VERSION}-build-${BUILD_ID}-foss-UNSIGNED.apk"
            SYNC_SRC="sync-app/build/outputs/apk/release/sync-app-release-unsigned.apk"
            SYNC_NAME="LoheSync-${RELEASE_VERSION}-build-${BUILD_ID}-UNSIGNED.apk"
          fi
          cp "$SRC_APK" "foss-output/$OUT_NAME"
          cp "$SYNC_SRC" "sync-output/$SYNC_NAME"
          BADGING="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "foss-output/$OUT_NAME" | head -5)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.lohe.app.foss'"
          SYNC_BADGING="$("$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "sync-output/$SYNC_NAME" | head -5)"
          echo "$SYNC_BADGING"
          echo "$SYNC_BADGING" | grep -q "package: name='com.lohe.sync'"
          if [ "$FOSS_SIGNED" = "true" ]; then
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "foss-output/$OUT_NAME"
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "sync-output/$SYNC_NAME"
          fi
          (cd foss-output && sha256sum "$OUT_NAME" > "${OUT_NAME}.sha256")
          (cd sync-output && sha256sum "$SYNC_NAME" > "${SYNC_NAME}.sha256")
          cat "foss-output/${OUT_NAME}.sha256"
          cat "sync-output/${SYNC_NAME}.sha256"

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lohe-release.keystore"

      - name: Upload test reports
        # Only on failure — a green run does not need its XML, and these are
        # 199 files' worth of noise otherwise.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            app/build/test-results/testFossDebugUnitTest/*.xml
            app/build/reports/tests/testFossDebugUnitTest/
            app/build/test-results/testPlayDebugUnitTest/*.xml
            app/build/reports/tests/testPlayDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload FOSS release APK and R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lohe-${{ steps.metadata.outputs.release }}-build-${{ steps.metadata.outputs.build_id }}-foss-${{ steps.signing.outputs.signed == 'true' && 'release' || 'UNSIGNED' }}
          path: |
            foss-output/*
            app/build/outputs/mapping/fossRelease/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload owner sync APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lohe-sync-${{ steps.metadata.outputs.release }}-build-${{ steps.metadata.outputs.build_id }}-${{ steps.signing.outputs.signed == 'true' && 'release' || 'UNSIGNED' }}
          path: |
            sync-output/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned Play build and R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lohe-${{ steps.metadata.outputs.release }}-build-${{ steps.metadata.outputs.build_id }}-play-UNSIGNED
          path: |
            app/build/outputs/bundle/playRelease/app-play-release.aab
            app/build/outputs/mapping/playRelease/mapping.txt
          if-no-files-found: error
          retention-days: 14
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
