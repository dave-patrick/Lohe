name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # Matches the version the build is verified against locally, and the
          # floor AGP 9.4.1 requires.
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # android-actions/setup-android@v3 was tried here and failed: it shells
      # out to `sdkmanager tools`, and that package no longer exists under
      # cmdline-tools 16. The runner image already ships an SDK, so drive
      # sdkmanager directly instead.
      #
      # It is not on PATH by default — hence the explicit lookup. The platform
      # is `android-37.0` (preview-style suffix), which is what compileSdk 37
      # resolves to locally.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then echo "::error::sdkmanager not found under $ANDROID_SDK_ROOT"; exit 1; fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Write local.properties
        # The SDK path is machine-local and gitignored, so CI declares it the
        # same way a developer does. Never committed.
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lohe-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14