name: Legacy export build

# Builds a one-time update (0.11.2) of the ORIGINAL Lohe app (commit 2d123a0)
# that adds "Export library for new Lohe" to the Podcasts menu. It is signed
# with the original release key so it installs over the existing app without
# losing data. Not part of the FOSS export; delete this workflow and
# tools/legacy-export once the migration is done.
#
# Repository secrets (all four required):
#   LEGACY_KEYSTORE_BASE64   the release .jks file, base64-encoded
#   LEGACY_KEYSTORE_PASSWORD
#   LEGACY_KEY_ALIAS
#   LEGACY_KEY_PASSWORD

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/legacy-export/**'
      - '.github/workflows/legacy-export-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check signing secrets
        id: secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.LEGACY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Signing secrets not set yet; skipping the legacy build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare legacy source
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/legacy" 2d123a0
          git -C "$RUNNER_TEMP/legacy" apply "$GITHUB_WORKSPACE/tools/legacy-export/new-lohe-export.patch"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.secrets.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build signed release
        if: steps.secrets.outputs.ready == 'true'
        working-directory: ${{ runner.temp }}/legacy
        env:
          KEYSTORE_BASE64: ${{ secrets.LEGACY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LEGACY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LEGACY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LEGACY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT"
            printf 'keystore.path=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'keystore.password=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keystore.alias=%s\n' "$KEY_ALIAS"
            printf 'keystore.key.password=%s\n' "$KEY_PASSWORD"
          } > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain
          rm -f local.properties "$RUNNER_TEMP/release.jks"
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$APK" "$RUNNER_TEMP/out/Lohe-0.11.2-library-export.apk"

      - name: Upload APK
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lohe-0.11.2-library-export
          path: ${{ runner.temp }}/out/Lohe-0.11.2-library-export.apk
          retention-days: 14
