name: Build unsigned release APK for owner signing

on:
  push:
    branches: [feat/export-database]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Read build metadata
        id: metadata
        run: |
          echo "build_id=$(sed -n 's/^val loheBuildId = "\(.*\)"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "release=$(sed -n 's/^val loheReleaseVersion = "\(.*\)"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Build and zipalign unsigned release APK
        run: |
          ./gradlew :app:assembleRelease --console=plain
          mkdir -p release-output
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -p -f -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "release-output/Lohe-${{ steps.metadata.outputs.release }}-build-${{ steps.metadata.outputs.build_id }}-unsigned-aligned.apk"
          cp "$ANDROID_SDK_ROOT/build-tools/36.0.0/lib/apksigner.jar" release-output/apksigner.jar
          sha256sum release-output/*.apk
      - name: Upload unsigned release APK and apksigner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lohe-${{ steps.metadata.outputs.release }}-build-${{ steps.metadata.outputs.build_id }}-unsigned-release
          path: release-output/*
          if-no-files-found: error
          retention-days: 3
