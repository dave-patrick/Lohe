name: Build isolated debug APK

on:
  push:
    branches: [codex/lohe-debug-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Read build metadata
        id: metadata
        run: |
          echo "build_id=$(sed -n 's/^val loheBuildId = "\(.*\)"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "release=$(sed -n 's/^val loheReleaseVersion = "\(.*\)"/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Build isolated debug APK
        run: |
          ./gradlew :app:assembleDebug -PloheDebugApplicationIdSuffix=.codexdebug --console=plain
          mkdir -p debug-output
          cp app/build/outputs/apk/debug/app-debug.apk debug-output/Lohe-${{ steps.metadata.outputs.release }}-build-${{ steps.metadata.outputs.build_id }}-codexdebug.apk
          sha256sum debug-output/*.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging debug-output/*.apk | head -5
      - name: Upload debug APK for owner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lohe-${{ steps.metadata.outputs.release }}-build-${{ steps.metadata.outputs.build_id }}-codexdebug
          path: debug-output/*.apk
          if-no-files-found: error
          retention-days: 3
